; viewer.cfg — twindemo house viewer configuration (Godot ConfigFile / INI format).
; Read by main.gd at boot. Every value is documented below; command-line user args
; (--model=, --recording=) override anything set here.
;
; DEFAULT BOOT IS LIVE: no recording= is set on purpose, so a fresh `$GODOT --path .`
; connects to the running sim (LIVE mode, green HUD) and you see the live-data path
; first. To replay the bundled recording instead, pass it on the command line:
;   $GODOT --path . -- --recording=recordings/house-day.ndjson
; (or uncomment the recording= line under [twin]).

[viewer]
; Runtime-loaded GLB (GLTFDocument, no editor import). Node names carry IFC GlobalIds.
model="res://models/duplex.glb"
; Default live data source. The seeded sim (tools/sim/server.js) listens here by default.
url="ws://localhost:8765"

[twin]
; Tag->GlobalId binding map (project-relative). The sim derives its tags + ranges from it.
binding_map="binding_map.json"
; Per-frame budget in milliseconds. 16.7 ms = the 60 fps floor the frame-budget gate checks
; (verify_twin.sh, TWIN_BENCH=1). 1000 ms / 60 fps = 16.666... ms.
frame_budget_ms=16.7
; recording= is intentionally UNSET so the default boot is LIVE. Uncomment to boot into
; playback of the bundled fixture instead:
; recording="recordings/house-day.ndjson"
